services:
  mysql:
    image: mysql:8.0
    container_name: fdr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "financial_doc_review"
      # 容器内 3306 -> 宿主机 3309（与连接串 mysql+asyncmy://root:123456@127.0.0.1:3309/... 对齐）
    ports:
      - "3309:3306"
    volumes:
      - fdr_mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build: ../backend
    container_name: fdr-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+asyncmy://root:123456@mysql:3306/financial_doc_review?charset=utf8mb4"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-4o-mini}"
      LLM_ENABLED: "${LLM_ENABLED:-true}"
      OCR_ENABLED: "${OCR_ENABLED:-false}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../uploads:/app/uploads

  frontend:
    build: ../frontend
    container_name: fdr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  fdr_mysql_data:
